name: Capture maintained Rice screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-luna.yml
      - scripts/capture-luna.sh
      - src/main.rs
      - src/luna.rs
      - src/luna_icons.rs
      - src/mac.rs
      - src/win10.rs
      - src/extra_rices.rs
      - src/preferences.rs
  pull_request:
    paths:
      - .github/workflows/capture-luna.yml
      - scripts/capture-luna.sh
      - src/main.rs
      - src/luna.rs
      - src/mac.rs
      - src/win10.rs
      - src/extra_rices.rs
  workflow_dispatch:

# Do not publish an older page capture after a newer visual commit.
concurrency:
  group: ricewine-rices-capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install screenshot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0
      - name: Build current application
        run: cargo build --release --locked
      - name: Check Rust formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
      - name: Capture real desktop frames
        if: github.event_name != 'pull_request'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh luna
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh macos
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows10
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows98
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows7
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh chromeos
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh frutiger
      - name: Smoke-test all pages at 640x480 (all seven Rices)
        if: github.event_name == 'pull_request'
        env:
          RICEWINE_CAPTURE_WIDTH: '640'
          RICEWINE_CAPTURE_HEIGHT: '480'
          RICEWINE_CAPTURE_SUFFIX: '-compact'
        run: |
          for rice in luna macos windows10 windows98 windows7 chromeos frutiger; do
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh "$rice"
          done
      - name: Upload compact UI captures for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ricewine-compact-ui
          path: docs/screenshots/*-compact.webp
          retention-days: 7
      - name: Publish screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/{luna,macos,win10,win98,win7,chromeos,frutiger}-*.webp
          if git diff --cached --quiet; then
            echo 'All screenshot frames are unchanged'
            exit 0
          fi
          # Never overwrite a newer UI capture from a superseding source commit.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Source commit was superseded; skip stale screenshots'
            exit 0
          fi
          git commit -m 'docs: capture all seven RiceBowl desktop screens'
          git push origin HEAD:main
