name: Capture maintained Rice screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-luna.yml
      - scripts/capture-luna.sh
      - src/main.rs
      - src/luna.rs
      - src/luna_icons.rs
      - src/mac.rs
      - src/win10.rs
      - src/extra_rices.rs
      - src/preferences.rs
  pull_request:
    paths:
      - .github/workflows/capture-luna.yml
      - scripts/capture-luna.sh
      - src/main.rs
      - src/luna.rs
      - src/luna_icons.rs
      - src/mac.rs
      - src/win10.rs
      - src/extra_rices.rs
  workflow_dispatch:

# Do not publish an older page capture after a newer visual commit.
concurrency:
  group: ricewine-rices-capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install screenshot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0
      - name: Build current application
        run: cargo build --release --locked
      - name: Check Rust formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
      - name: Capture real desktop frames
        if: github.event_name != 'pull_request'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh luna
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh macos
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows10
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows98
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows7
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh chromeos
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh frutiger
      - name: Capture full-size XP Luna applet for visual review
        if: github.event_name == 'pull_request'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh luna
      - name: Capture full-size Mojave/Finder Mac screens for visual review
        if: github.event_name == 'pull_request'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh macos
      - name: Capture full-size Windows 10 Settings screens for visual review
        if: github.event_name == 'pull_request'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh windows10
      - name: Smoke-test six pages in each of seven Rices at minimum and common laptop sizes
        if: github.event_name == 'pull_request'
        run: |
          for dimensions in '560 400 minimum' '640 480 compact' '800 600 medium'; do
            read -r width height suffix <<< "$dimensions"
            export RICEWINE_CAPTURE_WIDTH="$width"
            export RICEWINE_CAPTURE_HEIGHT="$height"
            export RICEWINE_CAPTURE_SUFFIX="-$suffix"
            for rice in luna macos windows10 windows98 windows7 chromeos frutiger; do
              xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh "$rice"
            done
          done
      - name: Upload responsive UI captures for visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ricewine-responsive-ui
          path: |
            docs/screenshots/*-minimum.webp
            docs/screenshots/*-compact.webp
            docs/screenshots/*-medium.webp
          retention-days: 7
      - name: Upload full-size XP Luna screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xp-luna-native-applet
          path: |
            docs/screenshots/luna-library.webp
            docs/screenshots/luna-library-populated.webp
            docs/screenshots/luna-prefixes.webp
            docs/screenshots/luna-runners.webp
            docs/screenshots/luna-settings.webp
            docs/screenshots/luna-install.webp
            docs/screenshots/luna-import.webp
          retention-days: 14
          if-no-files-found: error
      - name: Upload seven full-size macOS screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-mojave-finder
          path: |
            docs/screenshots/macos-library.webp
            docs/screenshots/macos-library-populated.webp
            docs/screenshots/macos-prefixes.webp
            docs/screenshots/macos-runners.webp
            docs/screenshots/macos-settings.webp
            docs/screenshots/macos-install.webp
            docs/screenshots/macos-import.webp
          retention-days: 14
          if-no-files-found: error
      - name: Upload seven full-size Windows 10 screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows10-settings-native
          path: |
            docs/screenshots/win10-library.webp
            docs/screenshots/win10-library-populated.webp
            docs/screenshots/win10-prefixes.webp
            docs/screenshots/win10-runners.webp
            docs/screenshots/win10-settings.webp
            docs/screenshots/win10-install.webp
            docs/screenshots/win10-import.webp
          retention-days: 14
          if-no-files-found: error
      - name: Publish screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/{luna,macos,win10,win98,win7,chromeos,frutiger}-*.webp
          if git diff --cached --quiet; then
            echo 'All screenshot frames are unchanged'
            exit 0
          fi
          # Never overwrite a newer UI capture from a superseding source commit.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Source commit was superseded; skip stale screenshots'
            exit 0
          fi
          git commit -m 'docs: capture all seven RiceBowl desktop screens'
          git push origin HEAD:main
