name: Capture Luna screenshots

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-luna.yml
      - scripts/capture-luna.sh
      - src/main.rs
      - src/luna.rs
      - src/luna_icons.rs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install screenshot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0
      - name: Build current application
        run: cargo build --release --locked
      - name: Capture real desktop frames
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/capture-luna.sh
      - name: Publish screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/luna-library.webp docs/screenshots/luna-prefixes.webp docs/screenshots/luna-runners.webp docs/screenshots/luna-settings.webp
          if git diff --cached --quiet; then
            echo 'All screenshot frames are unchanged'
            exit 0
          fi
          # Never overwrite a newer UI capture from a superseding source commit.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Source commit was superseded; skip stale screenshots'
            exit 0
          fi
          git commit -m 'docs: capture actual XP Luna Blue desktop screens'
          git push origin HEAD:main
