name: Format Rust source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-rust.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ricewine-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Format all Rust files
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit formatted source if branch has not changed
        run: |
          git add src/
          if git diff --cached --quiet; then
            echo 'Rust source is already formatted'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'A newer commit exists; refusing to overwrite its formatting'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format XP Luna Rust source'
          git push origin HEAD:main
